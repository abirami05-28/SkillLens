<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SkillLens</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      scroll-behavior: smooth;
      background: #f8f9fc;
      color: #333;
    }

    nav {
      position: fixed;
      top: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0,0,0,0.7);
      padding: 15px 40px;
      z-index: 1000;
    }

    .nav-links {
      display: flex;
      gap: 20px;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-size: 18px;
      transition: color 0.3s;
    }

    nav a:hover {
      color: #4facfe;
    }

    .nav-buttons {
      display: flex;
      gap: 15px;
    }

    .nav-buttons button {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      transition: background 0.3s;
      color: white;
      background: #4facfe;
    }

    .nav-buttons button:hover {
      background: #00c4ff;
    }

    section {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      padding: 60px 20px;
    }

    /* HERO */
    #home {
      background: linear-gradient(to right, #4facfe, #00f2fe);
      color: white;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    #home h1 {
      font-size: 4rem;
      font-weight: 700;
      margin-bottom: 20px;
    }

    #home p {
      font-size: 1.5rem;
      opacity: 0.9;
    }

    /* FAQ section fix */
    .faq {
      width: 800px;
      max-width: 90%;
      margin: 15px auto;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #ddd;
      background: #fefefe;
      text-align: left;
      transition: all 0.3s ease;
    }

    footer {
      padding: 15px;
      text-align: center;
      background: #111;
      color: #ccc;
    }
  </style>
</head>
<body>

  <nav>
    <div class="nav-links">
      <a href="#home">Home</a>
      <a href="#about">About</a>
      <a href="#modules">Features</a>
      <a href="#faqs">FAQs</a>
      <a href="#contact">Contact</a>
    </div>
    <div class="nav-buttons">
      <button class="username" id="usernameBtn">Loading...</button>
    </div>
  </nav>

  <section id="home">
    <h1>Welcome to SkillLens</h1>
    <p>AI-Powered Recruitment Made Smarter, Fairer, and Faster</p>
  </section>

  <!-- Other sections omitted for brevity -->

  <footer>
    <p>© 2025 SkillLens. All rights reserved.</p>
  </footer>

  <!-- ✅ JS imports -->
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>

  <script>
    // 🌟 Load username dynamically from backend using stored JWT
    async function loadUser() {
      const token = localStorage.getItem("token"); // ✅ correct key
      const usernameBtn = document.getElementById("usernameBtn");

      if (!token) {
        usernameBtn.textContent = "Guest";
        usernameBtn.onclick = () => (window.location.href = "signin.html");
        return;
      }

      try {
        const res = await fetch(`${API_BASE}/auth/me`, { headers: authHeaders() });
        const data = await res.json();

        if (res.ok && data.user) {
          usernameBtn.textContent = data.user.username && data.user.username.trim() !== "" 
            ? data.user.username 
            : (data.user.email || "User");

          usernameBtn.onclick = () => (window.location.href = "userdash.html");
        } else {
          usernameBtn.textContent = "Guest";
          usernameBtn.onclick = () => (window.location.href = "signin.html");
        }
      } catch (err) {
        console.error("Error fetching user info:", err);
        usernameBtn.textContent = "Guest";
        usernameBtn.onclick = () => (window.location.href = "signin.html");
      }
    }

    loadUser();
  </script>
</body>
</html>
