<!DOCTYPE html>  
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkillLens - Sign In</title>

  <link rel="stylesheet" href="style.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: #f8f9fc;
      color: #333;
    }

    nav {
      position: fixed;
      top: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0,0,0,0.7);
      padding: 15px 40px;
      z-index: 1000;
    }

    .nav-links {
      display: flex;
      gap: 20px;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-size: 18px;
      transition: color 0.3s;
    }

    nav a:hover {
      color: #4facfe;
    }

    .nav-buttons {
      display: flex;
      gap: 15px;
    }

    .nav-buttons button {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      transition: background 0.3s;
    }

    .nav-buttons .signin {
      background: transparent;
      color: white;
      border: 1px solid white;
    }

    .nav-buttons .signin:hover {
      background: white;
      color: #333;
    }

    .nav-buttons .signup {
      background: #4facfe;
      color: white;
    }

    .nav-buttons .signup:hover {
      background: #00c4ff;
    }

    .signin-container {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding-top: 80px;
    }

    .signin-box {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    .signin-box h2 {
      margin-bottom: 20px;
      font-size: 1.8rem;
      color: #2c3e50;
    }

    .google-btn {
      background: #fdf5e6;
      color: #333;
      border: 1px solid #ddd;
      padding: 12px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      margin-bottom: 20px;
      transition: background 0.3s;
      width: 100%;
    }

    .google-btn:hover {
      background: #f5e1b9;
    }

    .signin-box input {
      width: 100%;
      padding: 10px;
      margin-bottom: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
    }

    .signin-box .button-group {
      display: flex;
      justify-content: space-between;
      margin-top: 15px;
    }

    .signin-box button {
      flex: 1;
      margin: 0 5px;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .back-btn {
      background: #ccc;
      color: #333;
    }

    .back-btn:hover {
      background: #aaa;
    }

    .login-btn {
      background: #4facfe;
      color: white;
    }

    .login-btn:hover {
      background: #00c4ff;
    }

    .create-account {
      margin-top: 15px;
      font-size: 14px;
    }

    .create-account a {
      color: #4facfe;
      text-decoration: none;
    }

    .create-account a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <nav>
    <div class="nav-links">
      <a href="index.html#home">Home</a>
      <a href="index.html#about">About</a>
      <a href="index.html#modules">Features</a>
      <a href="index.html#faqs">FAQs</a>
      <a href="index.html#contact">Contact</a>
    </div>
    <div class="nav-buttons">
      <button class="signin" onclick="window.location.href='signin.html'">Sign In</button>
      <button class="signup" onclick="window.location.href='signup.html'">Sign Up</button>
    </div>
  </nav>

  <!-- SIGN IN FORM -->
  <div class="signin-container">
    <div class="signin-box">
      <h2>Sign In</h2>
      <button type="button" class="google-btn" id="googleLoginBtn">
        <img src="https://developers.google.com/identity/images/g-logo.png" alt="Google Logo" width="20" style="vertical-align: middle; margin-right: 8px;">
        Sign in with Google
      </button>

      <form id="signinForm">
        <input type="text" id="email" placeholder="Email" required>
        <input type="password" id="password" placeholder="Password" required>
        <div class="button-group">
          <button type="button" class="back-btn" onclick="window.location.href='index.html'">Back</button>
          <button type="submit" class="login-btn">Log In</button>
        </div>
      </form>

      <div class="create-account">
        Don’t have an account? <a href="signup.html">Create one</a>
      </div>
    </div>
  </div>

  <!-- ✅ JS LINKS -->
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.getElementById("signinForm").addEventListener("submit", function(e) {
      e.preventDefault();
      login(); // calls the login() function from auth.js
    });

    document.getElementById("googleLoginBtn").addEventListener("click", googleLogin);
  </script>
</body>
</html>
